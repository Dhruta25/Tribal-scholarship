events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    upstream backend_api {
        server backend:5001;
    }

    upstream frontend_app {
        server frontend:80;
    }

    # 1. HTTP Server on Port 80 - Auto-Redirect to Secure HTTPS
    server {
        listen 80 default_server;
        server_name _;

        # ACME Challenge for Let's Encrypt renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Auto-Redirect all traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Official HTTPS Server on Port 443 with Let's Encrypt SSL
    server {
        listen 443 ssl default_server;
        server_name tribal-scholarship.65.1.139.149.nip.io 65.1.139.149.nip.io 65.1.139.149 _;

        ssl_certificate     /etc/letsencrypt/live/tribal-scholarship.65.1.139.149.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tribal-scholarship.65.1.139.149.nip.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 25M;

        # 1. Express Backend REST API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 2. Uploaded Document Previews and Static Files
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Frontend React SPA
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Gateway Health check endpoint
        location /healthz {
            access_log off;
            return 200 "OK\n";
        }
    }
}
