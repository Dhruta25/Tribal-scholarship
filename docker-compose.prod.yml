version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mota_scholarship_backend
    restart: always
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=7d
      - CLIENT_URL=${CLIENT_URL:-https://tribalscholarship.duckdns.org,https://tribal-scholarship.65.1.139.149.nip.io,http://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - mota_net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/api
        - GEMINI_API_KEY=${GEMINI_API_KEY}
    container_name: mota_scholarship_frontend
    restart: always
    networks:
      - mota_net

  nginx:
    image: nginx:1.27-alpine
    container_name: mota_scholarship_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mota_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mota_scholarship_cloudflared
    restart: always
    command: tunnel --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - mota_net

networks:
  mota_net:
    driver: bridge
